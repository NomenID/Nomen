# nginx site template for Nomen.
# Point the web root at public/ -- nothing outside it is meant to be reachable.
# For HTTPS, run certbot and add the listen 443 / ssl_certificate lines it writes.

server {
    listen 80;
    server_name auth.example.com;

    root /var/www/nomen/public;
    index index.php;

    # Recovery evidence uploads: up to 5 x 1MB per request plus form slack.
    client_max_body_size 10m;

    # Front controller: every non-file path goes to public/index.php.
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param HTTPS $https if_not_empty;
    }

    # Built frontend assets carry a content hash in the filename.
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
    }

    location ~* \.(png|jpg|jpeg|gif|webp|avif|svg|woff2?)$ {
        try_files $uri =404;
        expires 30d;
    }

    location ~* \.(js|css)$ {
        try_files $uri =404;
        expires 12h;
    }

    # Dotfiles, and anything that should never leave the repo root.
    location ~ (^|/)\.(env|git|htaccess|htpasswd|DS_Store) {
        return 404;
    }

    location ~ /\.well-known/ {
        allow all;
    }

    access_log /var/log/nginx/nomen.access.log;
    error_log  /var/log/nginx/nomen.error.log;
}
