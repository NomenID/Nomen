<div class="wrap">
    <h1>这是项目目录，不是网站根目录</h1>
    <p>web 服务器的 root 指到了 Nomen 的根目录。入口在 <code>public/</code>，把 root 改过去再刷新。</p>
    <pre>nginx:  root /path/to/nomen/public;
apache: DocumentRoot /path/to/nomen/public</pre>
    <p>改完如果站点还没装，会自动跳到 <code>/nomen-install/</code> 的安装向导。</p>
    <div class="note">
        <p>root 改到 <code>public/</code> 之后，站点就正常了。根目录里的这个 <code>index.html</code> 只是个路标，可以删掉——<br>
        要删的是项目根目录这个文件，<code>public/</code> 里的东西别动。</p>
    </div>
    <p>完整步骤见 <a href="INSTALL.md">INSTALL.md</a>。</p>
</div>
</body>
