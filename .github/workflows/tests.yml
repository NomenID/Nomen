name: tests

on:
  push:
    branches: [main, qb]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: openssl, pdo_sqlite
          coverage: none

      - name: Lint PHP
        run: |
          status=0
          while IFS= read -r -d '' file; do
            php -l "$file" > /dev/null || status=1
          done < <(find . -name '*.php' -not -path './vendor/*' -print0)
          exit $status

      - name: Test
        run: php tests/run.php

      - name: Docs match code
        if: matrix.php == '8.3'
        run: php code-scripts/docgen.php --check
